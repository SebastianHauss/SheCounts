<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SheCounts - Admin Userlist</title>
    <link rel="icon" type="image/x-icon" href="../../img/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../css/global/variables.css" />
    <link rel="stylesheet" href="../../css/global/base.css" />
    <link rel="stylesheet" href="../../css/global/layout.css" />
    <link rel="stylesheet" href="../../css/global/utilities.css" />

    <!-- Components CSS -->
    <link rel="stylesheet" href="../../css/components/navbar.css" />
    <link rel="stylesheet" href="../../css/components/footer.css" />
    <link rel="stylesheet" href="../../css/components/buttons.css" />
    <link rel="stylesheet" href="../../css/admin/user-list.css" />
    <link rel="stylesheet" href="../../css/components/forms.css" />
    <link rel="stylesheet" href="../../css/components/modals.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <a
      href="#userlist-container"
      class="visually-hidden visually-hidden-focusable"
    >
      Skip to main content
    </a>

    <header id="navbar-placeholder"></header>

    <main id="userlist-container">
      <div class="container-fluid px-4 py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="user-list-h1 mb-0">User List</h1>
          <span class="badge bg-secondary" id="user-count">Loading...</span>
        </div>

        <!-- Search & Filter Bar -->
        <div class="user-filter-bar">
          <div class="row g-3 align-items-end">
            <!-- Search -->
            <div class="col-md-5">
              <label for="searchInput" class="form-label">
                <i class="bi bi-search"></i> Search
              </label>
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Username, email or country…"
              />
            </div>

            <!-- Role filter -->
            <div class="col-md-3">
              <label for="filterRole" class="form-label">
                <i class="bi bi-funnel"></i> Role
              </label>
              <select id="filterRole" class="form-select">
                <option value="">All Users</option>
                <option value="admin">Admins</option>
                <option value="user">Regular Users</option>
              </select>
            </div>

            <!-- Sort -->
            <div class="col-md-3">
              <label for="sortSelect" class="form-label">
                <i class="bi bi-sort-down"></i> Sort By
              </label>
              <select id="sortSelect" class="form-select">
                <option value="">Default</option>
                <option value="username">Username</option>
                <option value="created">Newest First</option>
                <option value="email">Email</option>
                <option value="country">Country</option>
                <option value="status">Status</option>
              </select>
            </div>

            <!-- Clear all button -->
            <div class="col-md-1 d-flex align-items-end">
              <button
                class="btn btn-outline-secondary w-100"
                onclick="clearAllFilters()"
                title="Clear all filters"
                aria-label="clear all filters button"
              >
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>

          <!-- Active filter tags appear here -->
          <div id="active-filters"></div>
        </div>

        <!-- Results count -->
        <div class="results-bar">
          <span id="results-count"></span>
        </div>

        <!-- User Cards Grid -->
        <div id="user-cards-grid">
          <!-- Cards injected by user-list.js -->
        </div>

        <!-- Pagination -->
        <nav
          aria-label="User list pagination"
          id="pagination-container"
          style="display: none"
        >
          <ul class="pagination justify-content-end mb-0">
            <li class="page-item disabled" id="prev-page">
              <a class="page-link" href="#" tabindex="-1">
                <i class="bi bi-chevron-left"></i> Previous
              </a>
            </li>
            <li class="page-item active">
              <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item" id="next-page">
              <a class="page-link" href="#"
                >Next <i class="bi bi-chevron-right"></i
              ></a>
            </li>
          </ul>
        </nav>
      </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>

    <!--    Config File, Utils -->
    <script src="../../js/config/config.js"></script>
    <script src="../../js/auth/auth-utils.js"></script>
    <!--    Core / Init Scripts (Load First)-->
    <script src="../../js/init/page-init.js"></script>
    <!--    Components-->
    <script src="../../js/components/navbar.js"></script>
    <script src="../../js/components/navigation.js"></script>
    <script src="../../js/components/modal-util.js"></script>
    <!--    Validation-->
    <script src="../../js/validation/form-validation.js"></script>
    <!--    Auth-->
    <script src="../../js/auth/auth-init.js"></script>
    <script src="../../js/auth/auth-check.js"></script>
    <script src="../../js/auth/login.js"></script>
    <script src="../../js/auth/logout.js"></script>
    <script src="../../js/auth/register.js"></script>
    <!--    Admin-->
    <!--  <script src="../../js/admin/create-article.js"></script>-->
    <script src="../../js/admin/user-list.js"></script>
  </body>
</html>
